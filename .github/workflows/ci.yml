name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    # Remove only the last condition after main requires source-linked alone.
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release'))
      || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up and stage the release package
        uses: ./.github/actions/stage-release
      - run: bun run typecheck
      - run: bun run lint
      - name: Pack, verify and dry-run both package names
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/create-release-source"
          x="$(cd "$staged" && npm pack . --pack-destination .)"
          scoped_tgz="$staged/$x"
          bun scripts/verify-example-seals.ts --tarball "$scoped_tgz"
          alias_tgz=$(bun scripts/alias_tarball.ts pack --name rig-create --out "$RUNNER_TEMP/alias-rig-create" --tarball "$scoped_tgz" --pack-timeout-ms 300000)
          bun scripts/verify-example-seals.ts --tarball "$alias_tgz"
          version="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')"
          view_json="$(mktemp)"
          view_err="$(mktemp)"
          trap 'rm -f "$view_json" "$view_err"' EXIT
          for package in @rig-c/create rig-create; do
            tarball="$scoped_tgz"
            if [ "$package" = rig-create ]; then tarball="$alias_tgz"; fi
            if npm view "$package@$version" version --json > "$view_json" 2> "$view_err"; then
              node -e '
                const fs = require("node:fs");
                const actual = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                if (actual !== process.argv[2]) {
                  console.error("npm view returned a different version; refusing dry-run");
                  process.exit(1);
                }
              ' "$view_json" "$version"
              printf 'dry-run skipped: %s@%s is already published; the tarball gate above is the check\n' "$package" "$version"
              continue
            fi
            if ! node -e '
              const fs = require("node:fs");
              try {
                const result = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                if (result?.error?.code === "E404") process.exit(0);
              } catch {}
              console.error("npm view failed without structured E404; refusing dry-run");
              process.exit(1);
            ' "$view_json"; then
              cat "$view_err" >&2
              exit 1
            fi
            npm publish "$tarball" --dry-run --access public
          done
      - run: bun scripts/run-registry-ci.ts
  source-linked:
    name: source-linked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: create
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Read pinned sibling SHAs
        id: pins
        working-directory: create
        run: |
          bun -e '
            import { appendFileSync, readFileSync } from "node:fs";
            const pins = JSON.parse(readFileSync("scripts/source-ci-pins.json", "utf8"));
            const out = process.env.GITHUB_OUTPUT;
            for (const [k, v] of Object.entries(pins)) appendFileSync(out, `${k}=${v}\n`);
          '
      - uses: actions/checkout@v4
        with:
          repository: rig-c/core
          ref: ${{ steps.pins.outputs.core }}
          path: core
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: rig-c/parts
          ref: ${{ steps.pins.outputs.parts }}
          path: parts
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: rig-c/play
          ref: ${{ steps.pins.outputs.play }}
          path: play
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: rig-c/review
          ref: ${{ steps.pins.outputs.review }}
          path: review
          fetch-depth: 0
      - name: Guard source pins against release tags
        working-directory: create
        run: bun scripts/check-source-pins.ts
      - name: Install external workspace with isolated linker
        run: |
          bun -e '
            import { writeFileSync } from "node:fs";
            writeFileSync("package.json", JSON.stringify({
              private: true,
              workspaces: ["core", "parts", "play", "review", "create"]
            }, null, 2) + "\n");
          '
          bun install --linker=isolated
          (cd play && bun run build:lib)
          test -f play/dist/index.js
          for pkg in core parts play review create; do
            git -C "$pkg" diff --exit-code
          done
      - name: Typecheck source workspace
        working-directory: create
        run: bun run typecheck
      - name: Lint source workspace
        working-directory: create
        run: bun run lint
      - name: Verify sibling source resolution and run full test suite
        working-directory: create
        run: bun --conditions=@rig-c/source scripts/run-source-ci.ts
