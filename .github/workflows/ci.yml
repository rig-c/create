name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
  source-linked:
    name: source-linked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: create
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Read pinned sibling SHAs
        id: pins
        working-directory: create
        run: |
          bun -e '
            import { appendFileSync, readFileSync } from "node:fs";
            const pins = JSON.parse(readFileSync("scripts/source-ci-pins.json", "utf8"));
            const out = process.env.GITHUB_OUTPUT;
            for (const [k, v] of Object.entries(pins)) appendFileSync(out, `${k}=${v}\n`);
          '
      - uses: actions/checkout@v4
        with:
          repository: rig-c/core
          ref: ${{ steps.pins.outputs.core }}
          path: core
      - uses: actions/checkout@v4
        with:
          repository: rig-c/parts
          ref: ${{ steps.pins.outputs.parts }}
          path: parts
      - uses: actions/checkout@v4
        with:
          repository: rig-c/play
          ref: ${{ steps.pins.outputs.play }}
          path: play
      - uses: actions/checkout@v4
        with:
          repository: rig-c/review
          ref: ${{ steps.pins.outputs.review }}
          path: review
      - name: Install sibling dependencies with isolated linker
        run: |
          for pkg in core parts play review; do
            (cd "$pkg" && bun install --frozen-lockfile --linker=isolated)
          done
          cd create
          bun install --frozen-lockfile --linker=isolated
          bun add --no-save --linker=isolated @rig-c/core@file:../core @rig-c/parts@file:../parts @rig-c/review@file:../review
          (cd ../review && bun add --no-save --linker=isolated @rig-c/core@file:../core @rig-c/parts@file:../parts @rig-c/play@file:../play)
      - name: Verify sibling source resolution and run focused source-linked tests
        working-directory: create
        run: bun --conditions=@rig-c/source scripts/run-source-ci.ts
