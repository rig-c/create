name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
  source-linked:
    name: source-linked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: create
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Read pinned sibling SHAs
        id: pins
        working-directory: create
        run: |
          bun -e '
            import { appendFileSync, readFileSync } from "node:fs";
            const pins = JSON.parse(readFileSync("scripts/source-ci-pins.json", "utf8"));
            const out = process.env.GITHUB_OUTPUT;
            for (const [k, v] of Object.entries(pins)) appendFileSync(out, `${k}=${v}\n`);
          '
      - uses: actions/checkout@v4
        with:
          repository: rig-c/core
          ref: ${{ steps.pins.outputs.core }}
          path: core
      - uses: actions/checkout@v4
        with:
          repository: rig-c/parts
          ref: ${{ steps.pins.outputs.parts }}
          path: parts
      - uses: actions/checkout@v4
        with:
          repository: rig-c/play
          ref: ${{ steps.pins.outputs.play }}
          path: play
      - uses: actions/checkout@v4
        with:
          repository: rig-c/review
          ref: ${{ steps.pins.outputs.review }}
          path: review
      - name: Install external workspace with isolated linker
        run: |
          bun -e '
            import { writeFileSync } from "node:fs";
            writeFileSync("package.json", JSON.stringify({
              private: true,
              workspaces: ["core", "parts", "play", "review", "create"]
            }, null, 2) + "\n");
          '
          bun install --linker=isolated
          bun --cwd play run build:lib
          for pkg in core parts play review create; do
            git -C "$pkg" diff --exit-code
          done
      - name: Verify sibling source resolution and run source-only test suite
        working-directory: create
        run: bun --conditions=@rig-c/source scripts/run-source-ci.ts
