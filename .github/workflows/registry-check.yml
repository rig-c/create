name: registry-check
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' }}

permissions:
  contents: read

jobs:
  check:
    # Registry check: main pushes, manual dispatch and PRs labelled `release`; source-linked gates every other PR.
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release') && (
        github.event.action != 'labeled' || github.event.label.name == 'release'
      ))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up and stage the release package
        uses: ./.github/actions/stage-release
      - run: bun run typecheck
      - run: bun run lint
      - name: Pack, verify and dry-run both package names
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/create-release-source"
          x="$(cd "$staged" && npm pack . --pack-destination .)"
          scoped_tgz="$staged/$x"
          bun scripts/verify-example-seals.ts --tarball "$scoped_tgz"
          alias_tgz=$(bun scripts/alias_tarball.ts pack --name rig-create --out "$RUNNER_TEMP/alias-rig-create" --tarball "$scoped_tgz" --pack-timeout-ms 300000)
          bun scripts/verify-example-seals.ts --tarball "$alias_tgz"
          version="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')"
          view_json="$(mktemp)"
          view_err="$(mktemp)"
          trap 'rm -f "$view_json" "$view_err"' EXIT
          for package in @rig-c/create rig-create; do
            tarball="$scoped_tgz"
            if [ "$package" = rig-create ]; then tarball="$alias_tgz"; fi
            if npm view "$package@$version" version --json > "$view_json" 2> "$view_err"; then
              bun scripts/npm-json.ts version "$view_json" "$package@$version" "$version"
              printf 'dry-run skipped: %s@%s is already published; the tarball gate above is the check\n' "$package" "$version"
              continue
            fi
            if ! bun scripts/npm-json.ts e404 "$view_json" "$package@$version"; then
              cat "$view_err" >&2
              exit 1
            fi
            npm publish "$tarball" --dry-run --access public
          done
      - run: bun scripts/run-registry-ci.ts
